name: Build Denemo UCRT64 Dependencies

on:
  workflow_dispatch:
  push:
    tags:
      - 'deps-v*'

jobs:
  build-deps:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-gc
            mingw-w64-ucrt-x86_64-libunistring
            mingw-w64-ucrt-x86_64-libiconv
            mingw-w64-ucrt-x86_64-gettext
            mingw-w64-ucrt-x86_64-libffi
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-portaudio
            mingw-w64-ucrt-x86_64-fluidsynth
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-aubio
            mingw-w64-ucrt-x86_64-autotools
            mingw-w64-ucrt-x86_64-texinfo
            mingw-w64-ucrt-x86_64-gperf
            flex

      # ── Build Guile from patched branch ───────────────────────────────────

      - name: Clone patched Guile
        run: |
          git clone --branch wip-mingw-2025 --depth 1 \
            https://github.com/jbenham2015/guile.git guile-src

      - name: Bootstrap Guile
        working-directory: guile-src
        run: |
          ./autogen.sh

      - name: Configure Guile
        working-directory: guile-src
        run: |
          ./configure \
            --prefix=/ucrt64 \
            --enable-mini-gmp \
            --enable-shared \
            --enable-static \
            --disable-nls \
            CFLAGS="-g -O2 -Wno-incompatible-pointer-types -Wno-int-conversion" \
            CPPFLAGS="-I/ucrt64/include" \
            LDFLAGS="-L/ucrt64/lib" \
            PKG_CONFIG_PATH="/ucrt64/lib/pkgconfig" \
            BDW_GC_CFLAGS="-I/ucrt64/include" \
            BDW_GC_LIBS="-L/ucrt64/lib -lgc"

      - name: Build Guile
        working-directory: guile-src
        run: make -j$(nproc) 2>&1 | tee ../guile-build.log

      - name: Install Guile
        working-directory: guile-src
        run: |
          make install
          # Second install into a staging dir so we can package ONLY Guile
          make install DESTDIR=/tmp/guile-stage

      - name: Verify Guile
        run: |
          /ucrt64/bin/guile --version
          pkg-config --modversion guile-3.0
          # No leftover references to the old prefix
          grep -l "/mingw64" /ucrt64/bin/guild /ucrt64/bin/guile-config \
            /ucrt64/lib/pkgconfig/guile-3.0.pc && echo "WARNING: old prefix found" || echo "prefix OK"

      # ── Package only Guile (everything else comes from pacman) ────────────

      - name: Package Guile
        run: |
          # Write into the workspace (cwd) so the Windows-native upload action can see it
          tar czf "$PWD/denemo-ucrt64-deps.tar.gz" -C /tmp/guile-stage/ucrt64 .
          ls -l denemo-ucrt64-deps.tar.gz
          tar tzf denemo-ucrt64-deps.tar.gz > /tmp/tarlist.txt
          grep -E 'libguile|guild|guile-3.0.pc' /tmp/tarlist.txt || { echo "ERROR: Guile files missing from tarball"; exit 1; }

      - name: Upload deps artifact
        uses: actions/upload-artifact@v4
        with:
          name: denemo-ucrt64-deps
          path: denemo-ucrt64-deps.tar.gz
          retention-days: 90
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guile-build-log
          path: guile-build.log

      # ── Publish as a GitHub Release (when triggered by a tag) ─────────────

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: denemo-ucrt64-deps.tar.gz
          name: Denemo UCRT64 Dependencies ${{ github.ref_name }}
          body: |
            UCRT64 Guile build (wip-mingw-2025) for building Denemo on Windows.
            Extract into the UCRT64 prefix (/ucrt64). Other dependencies come from pacman.
